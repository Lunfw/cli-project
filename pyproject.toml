[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name 		= "cli-project"
version 	= "0.1.0"
description	= "CLI framework!!!"
requires-python = ">=3.10"
dependencies = [
	"pudb",
	"pydantic"
]

[project.optional-dependencies]
dev = ["pudb"]

[tool.setuptools.packages.find]
where = ["src"]
